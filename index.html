<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#ffffff">
  <title>Mensagem</title>

  <style>
    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      width: 100%;
      min-height: 100%;
      background: #ffffff;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    img {
      display: block;
      width: 100%;
      height: auto;
      max-height: 100vh;
      object-fit: contain;
      margin: 0 auto;
    }
  </style>
</head>

<body>

  <img
    id="imagemMensagem"
    alt="Mensagem da ação"
  >

  <script>
    document.getElementById("imagemMensagem").src =
      "imagem1.jpg?v=" + Date.now();
  </script>

</body>
</html>
